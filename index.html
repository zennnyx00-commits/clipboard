<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipZone</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; min-height: 100vh; box-sizing: border-box; }
    .container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 15px; }
    h2 { margin: 0; font-weight: 500; }
    #url-display { color: #888; font-size: 14px; margin-bottom: 10px; }
    textarea { width: 100%; height: 400px; background: #1e1e1e; color: #fff; border: 1px solid #333; padding: 15px; border-radius: 8px; font-size: 16px; font-family: monospace; resize: vertical; box-sizing: border-box; }
    textarea:focus { outline: none; border-color: #555; }
    button { background: #fff; color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:hover { background: #ddd; }
    .footer { margin-top: auto; padding-top: 30px; font-size: 14px; color: #666; text-align: center; }
    #status { font-size: 14px; text-align: right; color: #aaa; min-height: 20px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container" id="app-container">
    <h2 id="title">ClipZone</h2>
    <div id="url-display"></div>
    <textarea id="content" placeholder="Ketik atau paste teks di sini..."></textarea>
    <div id="status"></div>
    <button id="saveBtn">Simpan</button>
  </div>

  <div class="footer">
    made by @zennlonevyn
  </div>

  <script>
    const path = window.location.pathname.substring(1); // Mengambil kata setelah '/'
    const textarea = document.getElementById('content');
    const statusDiv = document.getElementById('status');
    const saveBtn = document.getElementById('saveBtn');
    const urlDisplay = document.getElementById('url-display');

    if (!path) {
      // Jika di halaman utama (clip.zone.id/)
      textarea.classList.add('hidden');
      saveBtn.classList.add('hidden');
      urlDisplay.innerHTML = `Tambahkan nama catatan di URL untuk mulai.<br><br>Contoh: <a href="/catatan" style="color:#aaa;">${window.location.host}/catatan</a>`;
    } else {
      // Jika di halaman clip (clip.zone.id/catatan)
      urlDisplay.innerText = `${window.location.host}/${path}`;
      statusDiv.innerText = 'Memuat teks...';

      // Panggil API Backend Vercel untuk mengambil data
      fetch(`/api/get?id=${encodeURIComponent(path)}`)
        .then(res => res.json())
        .then(data => {
          if (data.content) {
            textarea.value = data.content;
            statusDiv.innerText = 'Teks berhasil dimuat.';
          } else {
            statusDiv.innerText = 'Clip kosong. Silakan isi dan simpan.';
          }
        })
        .catch(() => statusDiv.innerText = 'Gagal memuat teks.');

      // Simpan data
      saveBtn.onclick = async () => {
        statusDiv.innerText = 'Menyimpan...';
        saveBtn.disabled = true;
        try {
          const res = await fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: path, content: textarea.value })
          });
          if (res.ok) {
            statusDiv.innerText = 'Tersimpan!';
            statusDiv.style.color = '#4ade80'; // hijau
            setTimeout(() => { statusDiv.style.color = '#aaa'; statusDiv.innerText = ''; }, 3000);
          } else {
            throw new Error('Gagal');
          }
        } catch (e) {
          statusDiv.innerText = 'Gagal menyimpan.';
          statusDiv.style.color = '#f87171'; // merah
        }
        saveBtn.disabled = false;
      };
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZennClip</title>
  
  <!-- Font Orbitron & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome untuk Ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ================= LOADING SCREEN 3D ================= */
    #loader {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0b0813; z-index: 99999;
      display: flex; justify-content: center; align-items: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .zenn-3d {
      font-family: 'Orbitron', sans-serif; font-size: 38px; font-weight: 900;
      color: #fff; letter-spacing: 3px;
      /* Efek 3D Ungu */
      text-shadow: 0 1px 0 #7c3aed, 0 2px 0 #6d28d9, 0 3px 0 #5b21b6, 
                   0 4px 0 #4c1d95, 0 5px 0 #3b2c6b, 0 10px 15px rgba(0,0,0,0.6);
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); text-shadow: 0 1px 0 #7c3aed, 0 2px 0 #6d28d9, 0 3px 0 #5b21b6, 0 4px 0 #4c1d95, 0 5px 0 #3b2c6b, 0 22px 15px rgba(0,0,0,0.4); }
    }
    /* ===================================================== */

    body { 
      font-family: 'Inter', system-ui, sans-serif; 
      background: #11091f; 
      color: #e2ddeb; 
      display: flex; flex-direction: column; align-items: center; 
      padding: 15px 10px; margin: 0; min-height: 100vh; box-sizing: border-box; 
    }
    
    .container { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 18px; }

    /* Video Header + Efek Blur */
    .video-header {
      position: relative; width: 100%; height: 160px;
      border-radius: 12px; overflow: hidden;
      border: 1px solid #3b2c6b; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      background: #151126;
    }
    .video-header video {
      width: 100%; height: 100%; object-fit: cover;
      position: absolute; top: 0; left: 0; z-index: 1;
    }
    .video-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      /* Gradient dicampur efek Blur ringan */
      background: linear-gradient(to right, rgba(17, 9, 31, 0.8) 10%, rgba(17, 9, 31, 0.3) 100%);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      z-index: 2;
    }
    .header-text {
      position: absolute; bottom: 15px; left: 15px; z-index: 3; margin: 0;
      font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900;
      color: #ffffff; letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(138, 43, 226, 0.8);
    }

    /* Box Utama Editor */
    .app-box {
      background: #181229; padding: 18px; border-radius: 12px;
      border: 1px solid #2d224a; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: flex; flex-direction: column; gap: 15px;
    }

    .input-group {
      display: flex; border-radius: 8px; border: 1px solid #3b2c6b;
      background: #130d1f; overflow: hidden; width: 100%;
    }
    .input-group span {
      padding: 12px; color: #9d8db8; font-weight: 600;
      border-right: 1px solid #3b2c6b; background: #1a132b; font-size: 14px;
    }
    .input-group input {
      flex: 1; border: none; padding: 12px; font-size: 14px;
      outline: none; background: transparent; color: #fff; font-family: 'Inter', sans-serif;
    }

    /* Info Bar (URL & Tombol Kecil) */
    .info-bar {
      background: #130d1f; border: 1px solid #2d224a; padding: 12px;
      border-radius: 8px; font-size: 13px; display: flex; flex-direction: column; gap: 10px;
    }
    .info-bar a { color: #a78bfa; text-decoration: none; font-weight: 600; word-break: break-all; }
    
    .btn-row { display: flex; gap: 8px; }
    .btn-small {
      background: #1e1633; border: 1px solid #4c1d95; color: #d8b4fe;
      padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif;
    }
    .btn-small:hover { background: #3b2c6b; color: #fff; }

    #qr-container { 
      text-align: center; background: #fff; padding: 10px; 
      border-radius: 8px; display: inline-block; margin: 5px auto; 
      border: 2px solid #8b5cf6;
    }

    /* RICH TEXT EDITOR (Dengan Scroll & Pre-Wrap agar Enter terbaca) */
    .editor-container {
      display: flex; flex-direction: column;
      border: 1px solid #3b2c6b; border-radius: 8px;
      background: #0f0a18; overflow: hidden;
      transition: all 0.3s ease;
    }
    .toolbar {
      display: flex; gap: 5px; padding: 8px 12px;
      background: #1e1633; border-bottom: 1px solid #3b2c6b; align-items: center;
    }
    .toolbar button {
      background: transparent; border: none; color: #a78bfa;
      width: 30px; height: 30px; border-radius: 4px; cursor: pointer;
      font-size: 14px; transition: 0.2s;
    }
    .toolbar button:hover { background: #3b2c6b; color: #fff; }
    
    .rich-editor {
      width: 100%; 
      height: 350px; /* Tinggi Fix supaya bisa di-scroll di dalam */
      padding: 15px; color: #e2ddeb; font-size: 14px; 
      font-family: 'Inter', sans-serif; outline: none; 
      overflow-y: auto; box-sizing: border-box; line-height: 1.6;
      white-space: pre-wrap; /* Mencegah enter hilang */
    }
    .rich-editor[placeholder]:empty:before {
      content: attr(placeholder); color: #6b5c8c; pointer-events: none;
    }

    /* Mode Fullscreen */
    .editor-container.fullscreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 9999; border-radius: 0; border: none; padding: 10px;
      background: #11091f; box-sizing: border-box;
    }
    .editor-container.fullscreen .rich-editor { 
      height: calc(100vh - 60px); /* Menyesuaikan tinggi layar penuh */
      flex-grow: 1; 
    }

    /* Tombol Utama */
    .btn-main { 
      background: linear-gradient(135deg, #7c3aed, #5b21b6); 
      color: #fff; border: 1px solid #4c1d95; padding: 12px; 
      border-radius: 8px; font-size: 15px; cursor: pointer; 
      font-weight: 600; text-transform: uppercase;
      font-family: 'Orbitron', sans-serif; width: 100%; transition: 0.2s;
    }
    .btn-main:hover { box-shadow: 0 0 15px rgba(124, 58, 237, 0.4); }
    #status { font-size: 12px; text-align: right; color: #8b79aa; font-weight: 600; }

    /* MENU RZONEAPI DOCS */
    .contact-box {
      background: #181229; padding: 15px; border-radius: 12px; 
      border: 1px solid #2d224a; display: flex; flex-direction: column; gap: 15px;
    }
    .contact-header {
      font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 700; 
      color: #fff; display: flex; align-items: center; gap: 8px;
    }
    .contact-header span { color: #a78bfa; }
    .contact-desc { font-size: 13px; color: #8b79aa; }
    
    .btn-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn-outline {
      background: transparent; border: 1px solid #3b2c6b; color: #a78bfa; 
      padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; 
      text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
      transition: 0.2s; font-family: 'Orbitron', sans-serif;
    }
    .btn-outline:hover { background: #2d224a; color: #fff; border-color: #5b21b6; }

    .footer { text-align: center; font-size: 11px; color: #55447a; margin-top: 10px; font-family: 'Orbitron', sans-serif; }
    .hidden { display: none !important; }
    .center { text-align: center; }
  </style>
</head>
<body>

  <!-- LOADING ANIMATION 3D -->
  <div id="loader">
    <div class="zenn-3d">ZENNCLIP</div>
  </div>

  <div class="container">
    
    <!-- HEADER VIDEO -->
    <div class="video-header">
      <video autoplay loop muted playsinline>
        <source src="https://vpqzrhjkndtvfrnajari.supabase.co/storage/v1/object/public/assets/1791182581853.mp4" type="video/mp4">
      </video>
      <div class="video-overlay"></div>
      <h1 class="header-text">ZENNCLIP</h1>
    </div>

    <!-- UI HOME (Buat Catatan Baru) -->
    <div id="home-ui" class="app-box hidden">
      <h3 style="margin: 0 0 10px 0; color: #d8b4fe; font-size: 16px; text-align: center; font-family: 'Orbitron', sans-serif;">CREATE ENDPOINT</h3>
      <div class="input-group">
        <span id="domain-prefix"></span>
        <input type="text" id="custom-path" placeholder="nama-bebas" autocomplete="off">
      </div>
      <button id="goBtn" class="btn-main">Buka Catatan</button>
    </div>

    <!-- UI EDITOR CATATAN -->
    <div id="clip-ui" class="app-box hidden">
      
      <div class="info-bar">
        <div><span style="color:#6b5c8c">URL:</span> <a href="#" id="url-display"></a></div>
        <div class="btn-row">
          <button id="copyUrlBtn" class="btn-small"><i class="fa-solid fa-copy"></i> Copy Link</button>
          <button id="showQrBtn" class="btn-small"><i class="fa-solid fa-qrcode"></i> QR Code</button>
        </div>
      </div>
      
      <div class="center">
        <div id="qr-container" class="hidden">
          <img id="qr-image" src="" alt="QR Code" width="130" height="130">
        </div>
      </div>

      <div id="status">Menyinkronkan data...</div>
      
      <!-- RICH TEXT EDITOR + TOOLBAR -->
      <div class="editor-container" id="editor-wrapper">
        <div class="toolbar">
          <button onclick="formatText('bold')" title="Tebal"><i class="fa-solid fa-bold"></i></button>
          <button onclick="formatText('italic')" title="Miring"><i class="fa-solid fa-italic"></i></button>
          <button onclick="formatText('underline')" title="Garis Bawah"><i class="fa-solid fa-underline"></i></button>
          <div style="flex-grow: 1;"></div>
          <!-- Tombol Fullscreen -->
          <button onclick="toggleFullscreen()" title="Perbesar layar" style="color: #d8b4fe;"><i class="fa-solid fa-expand" id="expand-icon"></i></button>
        </div>
        <div id="content" class="rich-editor" contenteditable="true" placeholder="Mulai ketik teks di sini..."></div>
      </div>

      <button id="saveBtn" class="btn-main">Simpan Catatan</button>
    </div>

    <!-- VIEWPORT MENU & SOSIAL MEDIA -->
    <div class="contact-box">
      <div class="contact-header">
        ZENN <span>DOCS</span>
      </div>
      <div class="contact-desc">Explore & connect with the developer.</div>
      
      <div class="btn-grid">
        <a href="#" class="btn-outline"><i class="fa-solid fa-code"></i> CONTACT DEV</a>
        <a href="#" class="btn-outline"><i class="fa-solid fa-bug"></i> FEEDBACK</a>
        <a href="https://whatsapp.com/channel/0029Vb8meSp9sBI1MP8jYB3M" target="_blank" class="btn-outline"><i class="fa-brands fa-whatsapp"></i> CHANNEL</a>
        <a href="https://www.tiktok.com/@zennlonevyn?" target="_blank" class="btn-outline"><i class="fa-brands fa-tiktok"></i> TIKTOK</a>
      </div>
    </div>

    <div class="footer">RZONE VZ © 2026 · ZENNLONEVYN</div>

  </div>

  <script>
    // --- ANIMASI LOADING ---
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('loader');
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
        setTimeout(() => loader.remove(), 600); // Hilangkan elemen dari DOM setelah animasi
      }, 1000); // Tampil minimal 1 detik
    });

    // --- LOGIKA UI & FITUR ---
    const path = window.location.pathname.substring(1);
    const domain = window.location.host;
    
    // Fitur Teks (Tebal, Miring, dll)
    function formatText(command) {
      document.execCommand(command, false, null);
      document.getElementById('content').focus();
    }

    // Fitur Fullscreen
    function toggleFullscreen() {
      const editorWrapper = document.getElementById('editor-wrapper');
      const expandIcon = document.getElementById('expand-icon');
      
      editorWrapper.classList.toggle('fullscreen');
      if(editorWrapper.classList.contains('fullscreen')) {
        expandIcon.classList.remove('fa-expand');
        expandIcon.classList.add('fa-compress');
        document.body.style.overflow = 'hidden'; // Kunci scroll halaman utama
      } else {
        expandIcon.classList.remove('fa-compress');
        expandIcon.classList.add('fa-expand');
        document.body.style.overflow = 'auto'; // Buka kunci scroll
      }
    }
    
    if (!path) {
      document.getElementById('home-ui').classList.remove('hidden');
      document.getElementById('domain-prefix').innerText = domain + '/';
      
      const goToClip = () => {
        const newPath = document.getElementById('custom-path').value.trim().replace(/[^a-zA-Z0-9-_]/g, '-');
        if (newPath) window.location.href = '/' + newPath;
        else alert('Nama catatan tidak boleh kosong!');
      };

      document.getElementById('goBtn').onclick = goToClip;
      document.getElementById('custom-path').addEventListener('keypress', e => { if (e.key === 'Enter') goToClip(); });

    } else {
      document.getElementById('clip-ui').classList.remove('hidden');
      
      const fullUrl = window.location.origin + '/' + path;
      const urlDisplay = document.getElementById('url-display');
      urlDisplay.innerText = domain + '/' + path;
      urlDisplay.href = fullUrl;
      
      const qrContainer = document.getElementById('qr-container');
      document.getElementById('showQrBtn').onclick = () => {
        if (qrContainer.classList.contains('hidden')) {
            document.getElementById('qr-image').src = 'https://api.qrserver.com/v1/create-qr-code/?size=130x130&margin=2&data=' + encodeURIComponent(fullUrl);
            qrContainer.classList.remove('hidden');
        } else {
            qrContainer.classList.add('hidden');
        }
      };

      const copyBtn = document.getElementById('copyUrlBtn');
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(fullUrl);
        const oriText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Tersalin!';
        setTimeout(() => copyBtn.innerHTML = oriText, 2000);
      };

      const statusDiv = document.getElementById('status');
      const editorContent = document.getElementById('content');
      
      // Ambil data (Backend Vercel)
      fetch(`/api/get?id=${encodeURIComponent(path)}`)
        .then(res => res.json())
        .then(data => {
          if (data.content) {
            // Perbaikan untuk memastikan Enter (\n) di data lama diubah jadi <br> agar tidak menyambung
            let loadedContent = data.content;
            if (!/<[a-z][\s\S]*>/i.test(loadedContent) && loadedContent.includes('\n')) {
               loadedContent = loadedContent.replace(/\n/g, '<br>');
            }
            editorContent.innerHTML = loadedContent; 
            statusDiv.innerText = 'Data berhasil dimuat.';
            statusDiv.style.color = '#a78bfa';
          } else {
            statusDiv.innerText = 'Direktori kosong. Siap menerima input.';
          }
        })
        .catch(() => {
            statusDiv.innerText = 'Gagal terhubung ke server.';
            statusDiv.style.color = '#ef4444';
        });

      // Simpan data
      document.getElementById('saveBtn').onclick = async () => {
        statusDiv.innerText = 'Mengeksekusi penyimpanan...';
        statusDiv.style.color = '#a78bfa';
        try {
          const res = await fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: path, content: editorContent.innerHTML }) 
          });
          if (res.ok) {
            statusDiv.innerText = 'Sistem Diperbarui!';
            statusDiv.style.color = '#10b981';
            setTimeout(() => { statusDiv.innerText = ''; }, 3000);
          } else throw new Error('Gagal');
        } catch (e) {
          statusDiv.innerText = 'Gagal menyimpan!';
          statusDiv.style.color = '#ef4444';
        }
      };
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZennClip</title>
  <!-- Import font Orbitron untuk logo dan Inter untuk teks biasa -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Inter', system-ui, sans-serif; 
      background: #0b0813; /* Dark purple super gelap */
      color: #e2ddeb; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 20px 15px; 
      margin: 0; 
      min-height: 100vh; 
      box-sizing: border-box; 
    }
    
    .container { 
      width: 100%; 
      max-width: 700px; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
    }

    /* Container Header Video */
    .video-header {
      position: relative;
      width: 100%;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #3b2c6b;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      background: #151126;
    }

    .video-header video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Efek gradasi agar teks tetap terbaca meski video terang */
    .video-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to right, rgba(11, 8, 19, 0.9) 10%, rgba(11, 8, 19, 0.3) 100%);
      z-index: 2;
    }

    /* Teks ZennClip di atas video */
    .header-text {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 3;
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(138, 43, 226, 0.8), 0 0 5px rgba(138, 43, 226, 0.5);
    }

    /* Box Utama Editor */
    .app-box {
      background: #141024;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #2d224a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    #url-display { 
      color: #9d8db8; 
      font-size: 14px; 
      background: #0f0b1a;
      padding: 10px 15px;
      border-radius: 6px;
      border: 1px solid #221a38;
      word-break: break-all;
    }

    #url-display a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 600;
    }

    textarea { 
      width: 100%; 
      height: 350px; 
      background: #0a0811; 
      color: #e2ddeb; 
      border: 1px solid #3b2c6b; 
      padding: 15px; 
      border-radius: 8px; 
      font-size: 15px; 
      font-family: 'Courier New', Courier, monospace; 
      resize: vertical; 
      box-sizing: border-box; 
      transition: 0.3s;
    }

    textarea:focus { 
      outline: none; 
      border-color: #8b5cf6; 
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
    }

    /* Tombol Aksi */
    button { 
      background: linear-gradient(135deg, #7c3aed, #5b21b6); 
      color: #fff; 
      border: 1px solid #4c1d95; 
      padding: 14px; 
      border-radius: 8px; 
      font-size: 16px; 
      cursor: pointer; 
      font-weight: 600; 
      letter-spacing: 1px;
      transition: 0.2s; 
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
    }

    button:hover { 
      background: linear-gradient(135deg, #8b5cf6, #6d28d9); 
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
    }

    button:disabled {
      background: #2d224a;
      color: #6b5c8c;
      border-color: #1f1736;
      cursor: not-allowed;
      box-shadow: none;
    }

    #status { 
      font-size: 13px; 
      text-align: right; 
      color: #8b79aa; 
      min-height: 18px; 
      font-weight: 500;
    }

    .footer { 
      margin-top: auto; 
      padding-top: 30px; 
      font-size: 13px; 
      color: #55447a; 
      text-align: center; 
      font-family: 'Orbitron', sans-serif;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container" id="app-container">
    
    <!-- HEADER VIDEO ANIME -->
    <div class="video-header">
      <!-- GANTI URL DI BAWAH DENGAN URL VIDEO SUPABASE KAMU -->
      <video autoplay loop muted playsinline>
        <source src="https://vpqzrhjkndtvfrnajari.supabase.co/storage/v1/object/public/assets/animation.mp4" type="video/mp4">
      </video>
      <div class="video-overlay"></div>
      <h1 class="header-text">ZENNCLIP</h1>
    </div>

    <!-- AREA EDITOR -->
    <div class="app-box">
      <div id="url-display"></div>
      <textarea id="content" placeholder="// Ketik atau paste teks di sini..."></textarea>
      <div id="status"></div>
      <button id="saveBtn">Simpan Catatan</button>
    </div>

  </div>

  <div class="footer">
    RZONE VZ © 2026 · ZENNLONEVYN
  </div>

  <script>
    const path = window.location.pathname.substring(1); 
    const textarea = document.getElementById('content');
    const statusDiv = document.getElementById('status');
    const saveBtn = document.getElementById('saveBtn');
    const urlDisplay = document.getElementById('url-display');

    if (!path) {
      textarea.classList.add('hidden');
      saveBtn.classList.add('hidden');
      urlDisplay.innerHTML = `[!] Akses URL spesifik untuk mulai mencatat.<br><br>> <a href="/kode-rahasia">${window.location.host}/kode-rahasia</a>`;
    } else {
      urlDisplay.innerText = `ENDPOINT: ${window.location.host}/${path}`;
      statusDiv.innerText = 'Menyinkronkan data...';

      fetch(`/api/get?id=${encodeURIComponent(path)}`)
        .then(res => res.json())
        .then(data => {
          if (data.content) {
            textarea.value = data.content;
            statusDiv.innerText = 'Data berhasil dimuat.';
            statusDiv.style.color = '#a78bfa';
          } else {
            statusDiv.innerText = 'Direktori kosong. Siap menerima input.';
          }
        })
        .catch(() => {
          statusDiv.innerText = 'Gagal terhubung ke server.';
          statusDiv.style.color = '#ef4444';
        });

      saveBtn.onclick = async () => {
        statusDiv.innerText = 'Mengeksekusi penyimpanan...';
        statusDiv.style.color = '#a78bfa';
        saveBtn.disabled = true;
        try {
          const res = await fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: path, content: textarea.value })
          });
          if (res.ok) {
            statusDiv.innerText = 'Sistem Diperbarui!';
            statusDiv.style.color = '#10b981'; // emerald green
            setTimeout(() => { statusDiv.style.color = '#8b79aa'; statusDiv.innerText = ''; }, 3000);
          } else {
            throw new Error('Gagal');
          }
        } catch (e) {
          statusDiv.innerText = 'Koneksi terputus. Gagal menyimpan.';
          statusDiv.style.color = '#ef4444';
        }
        saveBtn.disabled = false;
      };
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipZone - The Ultimate Online Clipboard</title>
  <style>
    /* GAYA RETRO 2000-AN */
    body {
      font-family: "Times New Roman", Times, serif;
      background-color: #c0c0c0;
      color: #000000;
      margin: 0;
      padding: 10px;
    }
    .container {
      max-width: 750px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 2px solid #000000;
      padding: 15px;
      box-shadow: 2px 2px 0px #000;
    }
    
    /* Header & Teks */
    h1 {
      color: #000080;
      text-align: center;
      margin: 5px 0 10px 0;
      font-family: Arial, sans-serif;
      cursor: pointer;
      text-decoration: underline;
    }
    h2 { font-size: 18px; margin: 0 0 10px 0; }
    hr { border: 0; border-top: 2px solid #808080; border-bottom: 2px solid #ffffff; margin: 15px 0; }
    
    /* Slot Iklan Klasik */
    .ad-banner {
      width: 100%;
      max-width: 468px;
      height: 60px;
      margin: 10px auto;
      text-align: center;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tombol Jadul */
    button {
      background-color: #d4d0c8;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #404040;
      border-bottom: 2px solid #404040;
      padding: 4px 12px;
      font-family: "MS Sans Serif", Arial, sans-serif;
      font-size: 14px;
      color: #000;
      cursor: pointer;
    }
    button:active {
      border-top: 2px solid #404040;
      border-left: 2px solid #404040;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    /* Input & Area Teks */
    input[type="text"] {
      border: 2px inset #ffffff;
      background-color: #ffffff;
      padding: 4px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      width: 60%;
    }
    textarea {
      width: 100%;
      height: 350px;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      border: 2px inset #ffffff;
      background-color: #ffffff;
      box-sizing: border-box;
      padding: 5px;
      margin-top: 10px;
    }

    /* Kotak Info */
    .info-box {
      background-color: #ffffcc;
      border: 1px solid #000000;
      padding: 8px;
      margin-bottom: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    
    .status-text { font-family: Arial, sans-serif; font-weight: bold; font-size: 14px; margin-top: 5px; }
    
    /* Footer */
    .footer {
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 11px;
      margin-top: 20px;
      color: #333;
    }
    
    .hidden { display: none !important; }
    .center { text-align: center; }

    /* Modal QR Code */
    #qr-container { text-align: center; background: #fff; border: 2px outset #fff; display: inline-block; padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <h1 id="title" onclick="window.location.href='/'">ClipZone</h1>
    <div class="center" style="font-family: Arial; font-size: 12px; margin-top: -5px; color: #666;">
      <i>The Ultimate Cross-Device Text Paster</i>
    </div>

    <!-- SLOT IKLAN 1 (Atas) -->
    <div class="ad-banner">
      <script>
        atOptions = {
          'key' : '2775a914b29d0ef6812357b3f1dfdb64',
          'format' : 'iframe',
          'height' : 60,
          'width' : 468,
          'params' : {}
        };
      </script>
      <script src="https://www.highrevenueformat.com/2775a914b29d0ef6812357b3f1dfdb64/invoke.js"></script>
    </div>

    <hr>

    <!-- UI HALAMAN UTAMA -->
    <div id="home-ui" class="hidden center">
      <h2>Create or Open a Clip</h2>
      <p style="font-size: 14px; font-family: Arial;">Enter a name for your clip address:</p>
      
      <div style="margin: 20px 0;">
        <span style="font-family: Courier New; font-weight: bold; font-size: 16px;" id="domain-prefix"></span>
        <input type="text" id="custom-path" placeholder="your-clip-name" autocomplete="off">
      </div>
      
      <button id="goBtn"><b>Go / Create -></b></button>
      
      <!-- SLOT IKLAN 2 (Tengah Home) -->
      <br><br>
      <div class="ad-banner">
        <script>
          atOptions = {
            'key' : '2775a914b29d0ef6812357b3f1dfdb64',
            'format' : 'iframe',
            'height' : 60,
            'width' : 468,
            'params' : {}
          };
        </script>
        <script src="https://www.highrevenueformat.com/2775a914b29d0ef6812357b3f1dfdb64/invoke.js"></script>
      </div>
    </div>

    <!-- UI HALAMAN CATATAN (EDITOR) -->
    <div id="clip-ui" class="hidden">
      
      <div class="info-box">
        <strong>URL:</strong> <a href="#" id="url-display" style="color: #0000ee;"></a>
        <div style="margin-top: 8px;">
          <button id="copyUrlBtn">Copy Link</button>
          <button id="showQrBtn">Show QR Code</button>
        </div>
      </div>
      
      <div id="qr-container" class="hidden">
        <img id="qr-image" src="" alt="QR Code" width="150" height="150">
        <div style="font-family: Arial; font-size: 12px; margin-top: 5px;">Scan with Mobile</div>
      </div>

      <div class="status-text" id="status" style="color: blue;">Initializing...</div>

      <textarea id="content"></textarea>
      
      <div style="text-align: right; margin-top: 10px;">
        <button id="saveBtn" style="font-weight: bold; font-size: 16px; padding: 5px 20px;">SAVE CLIP</button>
      </div>

      <!-- SLOT IKLAN 3 (Bawah Editor) -->
      <div class="ad-banner" style="margin-top: 20px;">
        <script>
          atOptions = {
            'key' : '2775a914b29d0ef6812357b3f1dfdb64',
            'format' : 'iframe',
            'height' : 60,
            'width' : 468,
            'params' : {}
          };
        </script>
        <script src="https://www.highrevenueformat.com/2775a914b29d0ef6812357b3f1dfdb64/invoke.js"></script>
      </div>
    </div>

    <hr>

    <!-- FOOTER -->
    <div class="footer">
      <p>Best viewed with Internet Explorer 5.0 or Netscape Navigator at 800x600 resolution.</p>
      <p>&copy; 2026 ClipZone. Made by <a href="#" style="color:#0000ee;">@zennlonevyn</a></p>
    </div>

  </div>

  <script>
    const path = window.location.pathname.substring(1);
    const domain = window.location.host;
    
    const homeUi = document.getElementById('home-ui');
    const clipUi = document.getElementById('clip-ui');
    
    const domainPrefix = document.getElementById('domain-prefix');
    const customPathInput = document.getElementById('custom-path');
    const goBtn = document.getElementById('goBtn');
    
    const textarea = document.getElementById('content');
    const statusDiv = document.getElementById('status');
    const saveBtn = document.getElementById('saveBtn');
    const urlDisplay = document.getElementById('url-display');
    const showQrBtn = document.getElementById('showQrBtn');
    const copyUrlBtn = document.getElementById('copyUrlBtn');
    const qrContainer = document.getElementById('qr-container');
    const qrImage = document.getElementById('qr-image');

    if (!path) {
      homeUi.classList.remove('hidden');
      domainPrefix.innerText = 'http://' + domain + '/';
      
      const goToClip = () => {
        const newPath = customPathInput.value.trim().replace(/[^a-zA-Z0-9-_]/g, '-');
        if (newPath) {
            window.location.href = '/' + newPath;
        } else {
            alert('Clip name cannot be empty!');
        }
      };

      goBtn.onclick = goToClip;
      customPathInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') goToClip();
      });

    } else {
      clipUi.classList.remove('hidden');
      
      const fullUrl = window.location.origin + '/' + path;
      urlDisplay.innerText = 'http://' + domain + '/' + path;
      urlDisplay.href = fullUrl;
      
      showQrBtn.onclick = () => {
        if (qrContainer.classList.contains('hidden')) {
            qrImage.src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=1&data=' + encodeURIComponent(fullUrl);
            qrContainer.classList.remove('hidden');
        } else {
            qrContainer.classList.add('hidden');
        }
      };

      copyUrlBtn.onclick = () => {
        navigator.clipboard.writeText(fullUrl);
        const oriText = copyUrlBtn.innerText;
        copyUrlBtn.innerText = 'Copied!';
        setTimeout(() => copyUrlBtn.innerText = oriText, 2000);
      };

      statusDiv.innerText = 'Loading data from server...';
      statusDiv.style.color = '#0000ff';

      fetch(`/api/get?id=${encodeURIComponent(path)}`)
        .then(res => res.json())
        .then(data => {
          if (data.content) {
            textarea.value = data.content;
            statusDiv.innerText = 'Done.';
            statusDiv.style.color = '#008000';
          } else {
            statusDiv.innerText = 'Ready to create new clip.';
            statusDiv.style.color = '#000000';
          }
        })
        .catch(() => {
            statusDiv.innerText = 'Error loading data.';
            statusDiv.style.color = '#ff0000';
        });

      saveBtn.onclick = async () => {
        statusDiv.innerText = 'Saving data...';
        statusDiv.style.color = '#0000ff';
        saveBtn.disabled = true;
        try {
          const res = await fetch('/api/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: path, content: textarea.value })
          });
          if (res.ok) {
            statusDiv.innerText = 'Clip saved successfully!';
            statusDiv.style.color = '#008000';
            setTimeout(() => { statusDiv.innerText = 'Done.'; }, 3000);
          } else {
            throw new Error('Failed');
          }
        } catch (e) {
          statusDiv.innerText = 'Error saving clip!';
          statusDiv.style.color = '#ff0000';
        }
        saveBtn.disabled = false;
      };
    }
  </script>
</body>
</html>
